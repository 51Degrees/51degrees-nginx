/**
@example ipi/gettingStarted.conf

This example shows how to quickly start using 51Degrees' on-premise IP
intelligence in Nginx. This example is available in full on [GitHub](
https://github.com/51Degrees/51degrees-nginx/blob/main/examples/ipi/gettingStarted.conf).

@include{doc} example-require-datafile-ipi.txt

This example uses the AsnName property which is available in the free
51Degrees-IPIV4AsnIpiV41.ipi data file. From the root of the repository,
`sh cxx/data/get-data-files.sh 51Degrees-IPIV4AsnIpiV41.ipi` downloads it
to cxx/data/ip-intelligence. When using a data file with a fuller set of
properties, such as the Lite or Enterprise files, properties like
RegisteredName, RegisteredCountry and RegisteredOwner can be requested in
the same way.

The example also asks for Country, Latitude and Longitude, which only the
Enterprise data file has. On a free data file each reads NoMatch, and the
x-enterprise header says where to ask for a copy of the Enterprise data
file.

When running on a local machine the client IP address reported by Nginx is
a loopback or private network address, which has no useful IP intelligence
associated with it. The second match below therefore reads a real IP
address from the client_ip query string argument via the $arg_client_ip
variable, overriding the reported client IP address for that match. This
is the mechanism used by the tests. In production the variable argument
can be omitted, as in the first match below, so the client IP address is
used directly.

Before using the example, update the followings:
- Remove this 'how to' guide block.
- Update the %%%DAEMON_MODE%% to 'on' or 'off'.
- Remove the %%%TEST_GLOBALS%%.
- Update the %%%MODULE_PATH%% with the actual path.
- Remove the %%%TEST_GLOBALS_HTTP%%.
- Update the %%%FILE_PATH_IPI%% with the actual file path.
- Replace the nginx.conf with this file or run Nginx with `-c`
option pointing to this file.
- Create a static file `ipi` in the Nginx `document_root`.

In a Linux environment, once Nginx has started, run the following command:
```
$ curl "localhost:8080/ipi?client_ip=212.58.224.22" -I
```
Expected output:
```
HTTP/1.1 200 OK
...
x-asn: <the ASN name of the network the client IP belongs to>
x-asn-query: \"BBC\":1
x-location-query: NoMatch,NoMatch,NoMatch
x-enterprise: Some of these properties need the Enterprise data file. Contact us for a copy at https://51degrees.com/contact-us?utm_source=code&utm_medium=example&utm_campaign=51degrees-nginx&utm_content=examples-ipi-gettingstarted.conf&utm_term=enterprise-data-file
...
```
Values are returned in the form `"value":weight` where the weight indicates
the confidence the engine has in the value.

`NOTE`: All the lines above, this line and the end of comment block line after
this line should be removed before using this example.
*/

## Replace DAEMON_MODE with 'on' or 'off' before running ##
## with Nginx. ##
daemon %%DAEMON_MODE%%;
worker_processes 4;

## The following line is required for testing. Remove before ##
## running with Nginx. ##
%%TEST_GLOBALS%%
## Update MODULE_PATH before running with Nginx ##
load_module %%MODULE_PATH%%modules/ngx_http_51D_ipi_module.so;

events {
	worker_connections 1024;
}

# // Snippet Start
http {
	## The following line is required for testing. Remove before ##
	## running with Nginx. ##
	%%TEST_GLOBALS_HTTP%%
	## Set the IP intelligence data file for the 51Degrees module to use. ##
	## Update the FILE_PATH_IPI before running with Nginx. ##
	51D_file_path_ipi %%FILE_PATH_IPI%%;

	## Country, Latitude and Longitude are only in the Enterprise data ##
	## file, and read NoMatch on a free one. Then x-enterprise says ##
	## where to ask for a copy. ##
	map $http_x_location_query $enterprise_note {
		"~NoMatch" "Some of these properties need the Enterprise data file. Contact us for a copy at https://51degrees.com/contact-us?utm_source=code&utm_medium=example&utm_campaign=51degrees-nginx&utm_content=examples-ipi-gettingstarted.conf&utm_term=enterprise-data-file";
		default "";
	}

	server {
		listen 127.0.0.1:8080;
		server_name localhost;

		location /ipi {
			## Do an IP intelligence match on the client IP address ##
			51D_match_ipi x-asn AsnName;

			## Do an IP intelligence match on the IP address passed ##
			## in the 'client_ip' query argument ##
			51D_match_ipi x-asn-query AsnName $arg_client_ip;

			## Match the location of the IP address passed in the ##
			## 'client_ip' query argument, which only the Enterprise ##
			## data file has ##
			51D_match_ipi x-location-query Country,Latitude,Longitude $arg_client_ip;

			## Add to response headers for easy viewing. ##
			add_header x-asn $http_x_asn;
			add_header x-asn-query $http_x_asn_query;
			add_header x-location-query $http_x_location_query;
			add_header x-enterprise $enterprise_note;
		}
	}
}
# // Snippet End

/**
@example hash/jsExample/javascript.conf

This example shows how to return Javascript to obtain further evidence for
51Degrees' on-premise device detection in Nginx. This example is available
in full on [GitHub](https://github.com/51Degrees/51degrees-nginx/blob/main/examples/hash/jsExample/javascript.conf).

@include{doc} example-require-datafile.txt

The example needs ScreenPixelsWidthJavascript, which only the Enterprise data
file has. The free Lite data file has ScreenPixelsWidth, so `/overrides` gives
the width the file holds for the User-Agent, but `/51D.js` returns a comment
saying the Javascript is not available, so the page cannot send the browser's
own width. Then `/overrides` also gives an x-enterprise header, which the page
shows, linking to
[contact us](https://51degrees.com/contact-us?utm_source=code&utm_medium=example&utm_campaign=51degrees-nginx&utm_content=examples-hash-jsexample-javascript.conf&utm_term=enterprise-data-file)
for a copy of the Enterprise data file. With the Enterprise data file there is
no x-enterprise header.

Before using the example, update the followings:
- Remove this 'how to' guide block.
- Update the file path specifed in `51D_file_path` with the actual file path.
- Replace the nginx.conf with this file or run Nginx with `-c` 
option pointing to this file.
- Create a static file `overrides` in the Nginx `document_root`.

In a Linux environment, once Nginx has started, open the [index.html](
https://github.com/51Degrees/51degrees-nginx/blob/main/examples/hash/jsExample/index.html)
in a browser.

The `index.html` send a request to the `/51D.js` endpoint to obtain the javascript
and execute it as below:
```
<script src="http://localhost:8888/51D.js"></script>
```
Then use the obtained screen pixels width to send back to the `/overrides` endpoint.
The full details can be seen in the `index.html`.

The Javascript can be seen by running the below command.
```
$ curl localhost:8080/51D.js -A "Mozilla/5.0 (iPhone; CPU iPhone OS 7_1 like Mac OS X) AppleWebKit/537.51.2 (KHTML, like Gecko) Version/7.0 Mobile/11D167 Safari/9537.53"
```

Expected display after open the `index.html` in the browser is:
```
Screen Pixels Width: 1920
```
The number should be the screen pixels width of your machine. On the free Lite
data file the page shows the width the file holds for the browser's User-Agent,
and the note with the link to ask for the Enterprise data file.

`NOTE`: All the lines above, this line and the end of comment block line after
this line should be removed before using this example.
*/

worker_processes 4;

load_module modules/ngx_http_51D_module.so;

events {
	worker_connections 1024;
}
# // Snippet Start
http {
	## Set the data file for the 51Degrees module to use ##
	51D_file_path ./cxx/data/device-detection/51Degrees-LiteV4.1.hash;

	## ScreenPixelsWidthJavascript is only in the Enterprise data file, ##
	## and reads NoMatch on a free one. Then x-enterprise says where to ##
	## ask for a copy. ##
	map $http_x_javascript $enterprise_note {
		"NoMatch" "ScreenPixelsWidthJavascript needs the Enterprise data file. Contact us for a copy at https://51degrees.com/contact-us?utm_source=code&utm_medium=example&utm_campaign=51degrees-nginx&utm_content=examples-hash-jsexample-javascript.conf&utm_term=enterprise-data-file";
		default "";
	}

	server {
		listen 8888;

		location /overrides {
			## Get screen pixels width. Use matched all so override evidence can be processed ##
			51D_match_all x-screenpixelswidth ScreenPixelsWidth;
			## Get the javascript property, for the note on a free data file ##
			51D_match_all x-javascript ScreenPixelsWidthJavascript;

			## Add to response headers for easy viewing. ##
			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Heaaders *;
			add_header Access-Control-Expose-Headers *;
			add_header x-screenpixelswidth $http_x_screenpixelswidth;
			add_header x-enterprise $enterprise_note;
		}

		location /51D.js {
			## Get the javascript from ScreenPixelsWidthJavascript property ##
			51D_get_javascript_single ScreenPixelsWidthJavascript;

			## Since the URL location does not actually exist, an error will be logged, ##
			## disable file not found error logging ##
			log_not_found off;
		}
	}
}
# // Snippet End

name: Temporary timing of main against the release head

on:
  push:
    branches:
      - tmp/timing-nginx

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  NGINX_VERSION: 1.29.3
  HEAD_REF: rc
  ROUNDS: 10

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 51Degrees/common-ci
      - name: Fetch the assets
        env:
          KEY: ${{ secrets.DEVICE_DETECTION_KEY }}
        run: ./steps/fetch-assets.ps1 -DeviceDetection $env:KEY -Assets 'TAC-HashV41.hash','20000 Evidence Records.yml','20000 User Agents.csv'
      - uses: actions/cache/save@v5
        with:
          key: tmp-timing-nginx-${{ github.run_id }}
          path: assets

  timing:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          path: self
      - uses: actions/cache/restore@v5
        with:
          key: tmp-timing-nginx-${{ github.run_id }}
          path: assets
          fail-on-cache-miss: true
      - name: Clone main and the head
        shell: bash
        run: |
          set -e
          for v in main:main head:$HEAD_REF; do
            name=${v%%:*}
            ref=${v##*:}
            git clone -q --branch "$ref" --recurse-submodules --shallow-submodules https://github.com/51Degrees/51degrees-nginx "$name"
            git -C "$name" log -1 --format="$name at %H %s"
            git -C "$name/cxx" log -1 --format="$name cxx at %H %s"
            for asset in TAC-HashV41.hash "20000 Evidence Records.yml" "20000 User Agents.csv"; do
              ln -sf "$PWD/assets/$asset" "$name/cxx/data/device-detection/$asset"
            done
          done
          nproc
      - name: Fetch the Asn data file
        run: |
          foreach ($name in 'main', 'head') {
            $global:LASTEXITCODE = 0
            & "./$name/cxx/data/get-data-files.ps1" 51Degrees-IPIV4AsnIpiV41.ipi
            if ($LASTEXITCODE -ne 0) { throw "The Asn data file was not downloaded for $name" }
          }
      - name: Set up as CI does
        run: ./head/ci/setup-environment.ps1 -RepoName head -NginxVersion $env:NGINX_VERSION -Name performance
      - name: Build both
        shell: bash
        run: |
          set -e
          for name in main head; do
            if ! (cd "$name" && make DONT_CLEAN_TESTS=1 FIFTYONEDEGREES_NGINX_VERSION=$NGINX_VERSION "51DEGREES_DD_PATH=$PWD/cxx/data/device-detection/TAC-HashV41.hash" install > ../build-$name.log 2>&1); then
              tail -30 build-$name.log
              exit 1
            fi
            mkdir -p "modules/$name"
            cp "$name"/build/modules/*.so "modules/$name/"
            sha256sum "modules/$name/"*.so
          done
      - name: Build the harness
        shell: bash
        run: |
          set -e
          mkdir -p head/tests/performance/build
          cd head/tests/performance/build
          cmake .. > cmake.log 2>&1
          cmake --build . > build.log 2>&1 || { tail -30 build.log; exit 1; }
          ls -la evidence.yml uas.csv
      - name: Measure
        shell: bash
        run: bash self/.github/timing-nginx/perf.sh "$PWD/head" "$PWD/modules" "$ROUNDS"

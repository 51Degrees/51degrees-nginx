name: Temporary red build of the tests in pull request 457

on:
  push:
    branches:
      - 'tmp/red-457'

jobs:
  Build:
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-request.yml@main
    with:
      repo-name: 51degrees-nginx
      org-name: 51Degrees
      pull-request-id: 0
      dryrun: 'true'
      branch: tmp/red-457
      skip-compare-performance: true
      full-matrix: true
      common-ci-ref: tmp/no-macos
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      NginxKey: ${{ secrets.NGINX_PLUS_KEY }}
      NginxCert: ${{ secrets.NGINX_PLUS_CERT }}
      NginxJwtToken: ${{ secrets.NGINX_PLUS_JWT_TOKEN }}


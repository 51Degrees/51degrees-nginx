name: Temporary make install of each Device Detection example from a fresh clone

on:
  push:
    branches:
      - tmp/install-examples

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        ref: [rc, feature/install-any-example]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Build tools the README lists
        run: |
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y make zlib1g-dev libpcre2-dev libatomic1 > /dev/null
      - name: Fresh clone
        run: |
          git clone --branch ${{ matrix.ref }} --recurse-submodules --shallow-submodules --depth 1 https://github.com/51Degrees/51degrees-nginx n
          git -C n log -1 --format='%h %s'
      - name: Each example as its comment says
        run: |
          set +e
          cd n
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 7_1 like Mac OS X) AppleWebKit/537.51.2 (KHTML, like Gecko) Version/7.0 Mobile/11D167 Safari/9537.53'
          uaq='Mozilla/5.0%20(iPhone;%20CPU%20iPhone%20OS%207_1%20like%20Mac%20OS%20X)%20AppleWebKit/537.51.2%20(KHTML,%20like%20Gecko)%20Version/7.0%20Mobile/11D167%20Safari/9537.53'
          failed=0
          for e in config matchMetrics matchQuery responseHeaders/responseHeader; do
            case $e in
              config) url=localhost:8080/config ;;
              matchMetrics) url=localhost:8080/metrics ;;
              matchQuery) url="localhost:8080/query?user_agent=$uaq" ;;
              responseHeaders/responseHeader) url=localhost:8080/response.html ;;
            esac
            make install EXAMPLE=$e FIFTYONEDEGREES_NGINX_VERSION=1.29.3 > ../install.log 2>&1 || { echo "EXAMPLE $e: make install failed"; tail -5 ../install.log; failed=1; continue; }
            ./nginx -t > ../t.log 2>&1 && t=ok || t=failed
            ./nginx
            sleep 1
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "$ua" "$url")
            headers=$(curl -s -I -A "$ua" "$url" | grep -i -E '^x-' | tr -d '\r' | cut -c1-80 | tr '\n' ';')
            echo "EXAMPLE $e: nginx -t $t, GET $url answered $status, headers $headers"
            [ "$status" = 200 ] && [ "$t" = ok ] || failed=1
            ./nginx -s quit
            sleep 1
          done
          exit $failed
